# =============================================================================
# GCPM Species Configuration
# =============================================================================
#
# This file defines all aerosol species used in PM2.5 calculations from
# GEOS-Chem output. Each species carries attributes that drive the calculation
# pipeline in GCPM.py.
#
# --- Attribute Reference ---
#
#   mw:           Molecular weight (g/mol). Used in the ideal gas law conversion
#                 from volume mixing ratio (VMR) to mass concentration (ug/m3).
#
#   category:     Aerosol category for PM2.5 composition.
#                   SIA   - Secondary Inorganic Aerosol (NIT, SO4, NH4)
#                   POA   - Primary Organic Aerosol
#                   SOA   - Secondary Organic Aerosol
#                   BC    - Black Carbon
#                   SS    - Sea Salt
#                   Dust  - Mineral Dust
#
#   growth_group: Which hygroscopic growth factor to apply (wet mode only).
#                   SIA  -> 1.042 (default)
#                   ORG  -> 1.011 (default)
#                   SS   -> 1.17  (default)
#                   null -> no growth factor applied (BC, Dust)
#
#   omoc:         Organic-matter-to-organic-carbon ratio. Applied to OA species
#                 whose mass is reported as carbon mass. null if not applicable.
#                   1.4 for non-volatile POA (POA1/2 in SVPOA; OCPO in NVPOA)
#                   2.1 for semi-volatile/oxidized POA (OPOA1/2 in SVPOA; OCPI in NVPOA)
#
#   dust_frac:    PM2.5 mass fraction for dust bins that straddle the 2.5 um
#                 cutoff. null means the full bin is included (fine) or the
#                 species is not dust.
#
#   dust_frac_pm1: Same as dust_frac but for the PM1 (1 um) size cut, used by
#                 the Dust_PM1 composite. null = full bin (1.0); a number =
#                 partial fraction; 0.0 = excluded from PM1.
#                   DEAD: DST1 = 0.06 (DST2 excluded)
#                   L23:  DSTbin1 = DSTbin2 = 1.0, DSTbin3 = 0.073 (DSTbin4 excluded)
#
#   scheme:       Which model configuration scheme this species belongs to.
#                 Species with scheme=null are always included regardless of
#                 scheme selection.
#                   poa_scheme:  SVPOA | NVPOA
#                   soa_scheme:  complex | simple
#                   dust_scheme: DEAD | L23
#
#   include_if:   Optional toggle flag name. If set, the species is only
#                 included when that flag is True in the calculator config.
#                 Used for species whose inclusion is debatable.
#
#   alt1:         Whether an ALT1 (surface-level diagnostic) variant exists
#                 for this species. ALT1 is used for secondary aerosol only.
#
# --- Category Membership Summary ---
#
#   SIA:  NIT, SO4, NH4, (HMS if include_hms=True)
#   POA (SVPOA): POA1, POA2, OPOA1, OPOA2
#   POA (NVPOA): OCPI, OCPO
#   SOA (complex): ASOA1-3, ASOAN, TSOA0-3, SOAIE, SOAGX, LVOCOA,
#                   (INDIOL if include_indiol=True)
#   SOA (simple): SOAS
#   BC:   BCPI, BCPO
#   SS:   SALA
#   Dust (DEAD): DST1, DST2
#   Dust (L23):  DSTbin1, DSTbin2, DSTbin3, DSTbin4
#
# =============================================================================

# --- Default constants (can be overridden at runtime) ---
defaults:
  growth_factors:
    SIA: 1.042
    ORG: 1.011
    SS: 1.17
  omoc_ratios:
    POA: 1.4
    OPOA: 2.1
  standard_conditions:
    T: 298        # K
    P: 101325     # Pa
    R: 8.314      # J/(mol*K)

# --- Species definitions ---
species:

  # ---- Secondary Inorganic Aerosol (SIA) ----
  NIT:
    mw: 62.01
    category: SIA
    growth_group: SIA
    omoc: null
    dust_frac: null
    scheme: null
    include_if: null
    alt1: true

  SO4:
    mw: 96.06
    category: SIA
    growth_group: SIA
    omoc: null
    dust_frac: null
    scheme: null
    include_if: null
    alt1: true

  NH4:
    mw: 18.05
    category: SIA
    growth_group: SIA
    omoc: null
    dust_frac: null
    scheme: null
    include_if: null
    alt1: true

  HMS:
    mw: 111.1
    category: SIA
    growth_group: SIA
    omoc: null
    dust_frac: null
    scheme: null
    include_if: include_hms
    alt1: true

  # ---- POA (SVPOA scheme) ----
  POA1:
