  # ---- Sea Salt ----
  SALA:
    mw: 31.4
    category: SS
    growth_group: SS
    omoc: null
    dust_frac: null
    scheme: null
    include_if: null
    alt1: false

  # ---- Dust (DEAD scheme: DST1-4) ----
  # DST1: fine mode; PM2.5 fraction 1.0, PM1 fraction 0.06
  # DST2: straddles the 2.5 um cutoff; 30% of mass is PM2.5, excluded from PM1
  # DST3, DST4: coarse mode, excluded from PM2.5
  DST1:
